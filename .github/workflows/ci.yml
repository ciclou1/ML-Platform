name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      # 仓库当前存在既有 lint 债（大量 B008/E501），先不阻断流水线，
      # 仅报告违规数量，待清理后改为 gating。
      - name: Lint (ruff, informational)
        continue-on-error: true
        run: uv run ruff check app tests --output-format=concise
      - name: Tests (pytest)
        run: uv run --extra dev python -m pytest tests -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Type check + build
        run: pnpm build
